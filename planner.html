<main>
<section class="block narrow">
  <h1>Academic planner</h1>
  <p>Add your study tasks, tick them off, and delete them. Tasks stay saved in this browser.</p>
  <form id="task-form" novalidate>
    <label for="task-input">New task</label>
    <div class="row"><input id="task-input" type="text" placeholder="e.g. Finish Python lab"><button class="btn" type="submit">Add task</button></div>
    <p id="task-error" class="error" role="alert"></p>
  </form>
  <p id="task-count" class="small"></p>
  <ul id="task-list" class="tasks"></ul>
  <button id="clear-done" class="btn btn-outline" type="button">Clear completed</button>
</section>
